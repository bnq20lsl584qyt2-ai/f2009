<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>معلوماتي | OG4_Z SYSTEM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Cairo:wght@400;700;900&display=swap');

        :root {
            --neon-blue: #00f2ff;
            --neon-purple: #7000ff;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --bg: #020205;
            --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: white;
            margin: 0;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #101025 0%, #020205 100%);
        }

        /* الهيدر الملكي */
        header {
            padding: 60px 20px 30px;
            text-align: center;
        }

        .avatar-wrapper {
            position: relative;
            display: inline-block;
            cursor: pointer;
            transition: 0.5s var(--spring);
        }

        .imperial-avatar {
            width: 120px; height: 120px;
            border-radius: 50%;
            border: 2px solid var(--neon-blue);
            padding: 5px;
            box-shadow: 0 0 30px var(--neon-blue);
        }

        .avatar-wrapper:active { transform: scale(0.9) rotate(5deg); }

        .system-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 900;
            margin-top: 15px;
            letter-spacing: 3px;
            background: linear-gradient(to right, #fff, var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* مستطيل التنقل الزجاجي */
        .nav-rect {
            max-width: 95%; width: 500px;
            margin: 0 auto 40px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            display: flex;
            justify-content: space-around;
            padding: 15px;
            position: sticky; top: 15px; z-index: 1000;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .nav-item {
            text-align: center;
            text-decoration: none;
            color: #777;
            font-size: 11px;
            font-weight: 900;
            transition: 0.3s var(--spring);
        }
        .nav-item.active { color: var(--neon-blue); transform: scale(1.1); }
        .nav-item i { display: block; font-size: 22px; margin-bottom: 5px; color: var(--neon-blue); }

        /* حاويات المحتوى */
        .container {
            max-width: 1100px;
            margin: auto;
            padding: 0 15px 100px;
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }
        .container.active { display: grid; animation: fadeIn 0.5s var(--spring); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* الكروت الزجاجية */
        .glass-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 25px 10px;
            text-align: center;
            transition: 0.4s var(--spring);
            backdrop-filter: blur(10px);
        }
        .glass-card:hover { border-color: var(--neon-blue); transform: translateY(-10px); }

        .glass-card img {
            width: 75px; height: 75px;
            border-radius: 50%;
            border: 2px solid var(--neon-blue);
            margin-bottom: 12px;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
        }

        .action-btn {
            display: inline-block;
            background: var(--neon-blue);
            color: black;
            text-decoration: none;
            padding: 7px 20px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 13px;
            margin-top: 10px;
        }

        /* نافذة السيرفرات (Modal) */
        .modal-servers {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            z-index: 2000;
            display: none;
            flex-direction: column;
            padding: 50px 20px;
            overflow-y: auto;
        }
        .modal-servers.active { display: flex; animation: slideIn 0.5s var(--spring); }

        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        .plan-card {
            background: var(--glass);
            border: 1px solid var(--neon-blue);
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .plan-card h2 { margin: 0; font-family: 'Orbitron'; color: var(--neon-blue); font-size: 28px; }

        /* لوحة التحكم الشاملة (Admin) */
        #adminDrawer {
            position: fixed;
            top: 0; left: -100%;
            width: 85%; max-width: 400px; height: 100%;
            background: #08090f;
            z-index: 3000;
            padding: 40px 25px;
            transition: 0.6s var(--spring);
            border-right: 2px solid var(--neon-blue);
        }
        #adminDrawer.active { left: 0; }

        .admin-input {
            width: 100%; padding: 15px; background: #111;
            border: 1px solid #333; color: white;
            border-radius: 12px; margin-bottom: 15px; font-family: 'Cairo';
        }

        .admin-btn {
            width: 100%; padding: 15px; background: var(--neon-blue);
            color: black; font-weight: 900; border: none;
            border-radius: 12px; cursor: pointer;
        }

        .overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 2500; backdrop-filter: blur(10px);
        }

    </style>
</head>
<body>

    <header>
        <div class="avatar-wrapper" onclick="openAdmin()">
            <img src="https://t.me/i/userpic/320/og4_z.jpg" class="imperial-avatar">
        </div>
        <div class="system-title">معلوماتي OS</div>
    </header>

    <!-- شريط التنقل الرباعي -->
    <div class="nav-rect">
        <a href="javascript:void(0)" class="nav-item active" onclick="switchTab('bots', this)">
            <i class="fas fa-robot"></i>
            <span>البوتات</span>
        </a>
        <a href="javascript:void(0)" class="nav-item" onclick="switchTab('channels', this)">
            <i class="fas fa-bullhorn"></i>
            <span>القنوات</span>
        </a>
        <a href="javascript:void(0)" class="nav-item" onclick="toggleServers(true)">
            <i class="fas fa-server"></i>
            <span>سيرفرات</span>
        </a>
        <a href="https://t.me/og4_z" class="nav-item">
            <i class="fas fa-headset"></i>
            <span>دعم</span>
        </a>
    </div>

    <!-- الأقسام -->
    <div id="bots-sec" class="container active"></div>
    <div id="channels-sec" class="container"></div>

    <!-- واجهة السيرفرات -->
    <div id="serverModal" class="modal-servers">
        <h1 style="text-align:center; font-family:'Orbitron'; color:var(--neon-blue);">SERVER PLANS</h1>
        <p style="text-align:center; color:gray; margin-bottom:40px;">نظام السيرفرات الإمبراطوري</p>
        
        <div class="plan-card">
            <div><h2>7 Days</h2><p>مقابل 15 نجمة تليجرام</p></div>
            <a href="https://t.me/og4_z" class="action-btn">حجز</a>
        </div>
        <div class="plan-card" style="border-color: var(--neon-purple);">
            <div><h2 style="color:var(--neon-purple)">15 Days</h2><p>مقابل 25 نجمة تليجرام</p></div>
            <a href="https://t.me/og4_z" class="action-btn" style="background:var(--neon-purple)">حجز</a>
        </div>
        <div class="plan-card">
            <div><h2>30 Days</h2><p>مقابل 50 نجمة تليجرام</p></div>
            <a href="https://t.me/og4_z" class="action-btn">حجز</a>
        </div>

        <button onclick="toggleServers(false)" style="margin-top:auto; background:none; border:none; color:gray; padding:30px; font-weight:900;">← العودة للقائمة الرئيسية</button>
    </div>

    <!-- لوحة التحكم (Admin) -->
    <div id="overlay" class="overlay" onclick="closeAdmin()"></div>
    <div id="adminDrawer">
        <h2 style="color: var(--neon-blue); font-family:'Orbitron';">ADMIN DASHBOARD</h2>
        <p style="color:gray; font-size:12px; margin-bottom:30px;">إدارة نظام معلوماتي الشامل</p>
        
        <input type="text" id="elName" class="admin-input" placeholder="اسم العنصر">
        <input type="text" id="elUser" class="admin-input" placeholder="اليوزر بدون @">
        
        <select id="elType" class="admin-input" style="background:#000; border-color:var(--neon-blue); color:var(--neon-blue); font-weight:900;">
            <option value="bots">إضافة لقسم البوتات</option>
            <option value="channels">إضافة لقسم القنوات</option>
        </select>
        
        <button class="admin-btn" onclick="deploy()">نشر العنصر (DEPLOY)</button>
        
        <p style="text-align:center; color:#222; margin-top:50px; cursor:pointer;" onclick="closeAdmin()">إغلاق اللوحة</p>
    </div>

    <script>
        const PASS = "admin@2009";

        function openAdmin() {
            let p = prompt("أدخل كود الوصول الإمبراطوري:");
            if(p === PASS) {
                document.getElementById('adminDrawer').classList.add('active');
                document.getElementById('overlay').style.display = 'block';
            } else if(p !== null) alert("تم رفض الوصول!");
        }

        function closeAdmin() {
            document.getElementById('adminDrawer').classList.remove('active');
            document.getElementById('overlay').style.display = 'none';
        }

        function switchTab(type, el) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            document.querySelectorAll('.container').forEach(sec => sec.classList.remove('active'));
            el.classList.add('active');
            document.getElementById(type + '-sec').classList.add('active');
        }

        function toggleServers(show) {
            document.getElementById('serverModal').classList.toggle('active', show);
        }

        function deploy() {
            const name = document.getElementById('elName').value;
            const user = document.getElementById('elUser').value.trim().replace('@','');
            const type = document.getElementById('elType').value;

            if(!name || !user) return alert("يرجى إكمال البيانات");

            const item = { name, user, type, id: Date.now() };
            let db = JSON.parse(localStorage.getItem('maalomati_db_final') || '[]');
            db.push(item);
            localStorage.setItem('maalomati_db_final', JSON.stringify(db));

            render();
            closeAdmin();
            document.getElementById('elName').value = '';
            document.getElementById('elUser').value = '';
        }

        function render() {
            const botSec = document.getElementById('bots-sec');
            const chanSec = document.getElementById('channels-sec');
            botSec.innerHTML = ''; chanSec.innerHTML = '';

            let db = JSON.parse(localStorage.getItem('maalomati_db_final') || '[]');

            db.forEach(item => {
                const html = `
                    <div class="glass-card">
                        <img src="https://t.me/i/userpic/320/${item.user}.jpg" onerror="this.src='https://ui-avatars.com/api/?name=${item.name}&background=00f2ff&color=000'">
                        <div style="font-weight:900; font-size:14px; margin-bottom:5px;">${item.name}</div>
                        <div style="color:var(--neon-blue); font-size:11px;">@${item.user}</div>
                        <a href="https://t.me/${item.user}" class="action-btn" target="_blank">دخول</a>
                        <br>
                        <i class="fas fa-trash-alt" onclick="erase(${item.id})" style="margin-top:15px; color:#1a1a1a; cursor:pointer; font-size:10px;"></i>
                    </div>
                `;
                if(item.type === 'bots') botSec.innerHTML += html;
                else chanSec.innerHTML += html;
            });
        }

        function erase(id) {
            if(confirm("هل تريد حذف هذا العنصر؟")) {
                let db = JSON.parse(localStorage.getItem('maalomati_db_final') || '[]');
                db = db.filter(i => i.id !== id);
                localStorage.setItem('maalomati_db_final', JSON.stringify(db));
                render();
            }
        }

        window.onload = render;
    </script>
</body>
</html>
