<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام معلوماتي | OG4_Z EMPIRE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Orbitron:wght@700;900&display=swap');

        :root {
            --neon-cyan: #00f7ff;
            --neon-pink: #ff007b;
            --gold: #ffc107;
            --bg-deep: #030408;
            --glass: rgba(255, 255, 255, 0.03);
            --spring: cubic-bezier(0.5, 1.5, 0.5, 1); /* محرك نيوتن المطور */
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-deep);
            color: white;
            margin: 0;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #10111a 0%, #030408 100%);
        }

        /* الهيدر الإمبراطوري */
        header {
            padding: 50px 20px;
            text-align: center;
            position: relative;
        }

        .avatar-container {
            position: relative;
            display: inline-block;
            cursor: pointer;
            transition: 0.5s var(--spring);
        }

        .main-avatar {
            width: 140px; height: 140px;
            border-radius: 50%;
            border: 3px solid var(--neon-cyan);
            padding: 5px;
            box-shadow: 0 0 30px var(--neon-cyan);
            filter: brightness(1.1);
        }

        .avatar-container:hover { transform: scale(1.1) rotate(5deg); }
        .avatar-container:active { transform: scale(0.9); }

        .empire-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            margin-top: 20px;
            background: linear-gradient(to bottom, #fff, var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        /* قسم معلوماتي - البطاقة التعريفية */
        .maalomati-hero {
            max-width: 90%;
            width: 500px;
            margin: 0 auto 30px;
            background: var(--glass);
            border: 1px solid rgba(0, 247, 255, 0.1);
            border-radius: 30px;
            padding: 25px;
            text-align: center;
            backdrop-filter: blur(15px);
        }

        /* شريط التنقل العلوي */
        .nav-sticky {
            position: sticky; top: 15px;
            z-index: 1000;
            max-width: 90%; width: 450px;
            margin: 0 auto 40px;
            background: rgba(10, 11, 16, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            display: flex;
            justify-content: space-around;
            padding: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .nav-link {
            text-align: center;
            color: #777;
            text-decoration: none;
            font-size: 11px;
            font-weight: bold;
            transition: 0.3s var(--spring);
        }
        .nav-link.active { color: var(--neon-cyan); transform: scale(1.2); }
        .nav-link i { display: block; font-size: 22px; margin-bottom: 4px; }

        /* المحتوى الديناميكي */
        .content-wrap {
            max-width: 1200px;
            margin: auto;
            padding: 0 15px 100px;
            display: none;
        }
        .content-wrap.active { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 15px; animation: zoomIn 0.4s var(--spring); }

        @keyframes zoomIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

        .imperial-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 25px;
            padding: 25px 15px;
            text-align: center;
            transition: 0.4s var(--spring);
        }
        .imperial-card:hover { border-color: var(--neon-cyan); background: rgba(0, 247, 255, 0.05); }

        .imperial-card img {
            width: 80px; height: 80px;
            border-radius: 50%;
            border: 2px solid var(--neon-cyan);
            margin-bottom: 12px;
            box-shadow: 0 0 15px rgba(0, 247, 255, 0.3);
        }

        .card-btn {
            display: inline-block;
            background: var(--neon-cyan);
            color: black;
            padding: 8px 25px;
            border-radius: 50px;
            font-weight: 900;
            text-decoration: none;
            font-size: 13px;
        }

        /* نافذة السيرفرات (مقابل نجوم) */
        .modal-servers {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-deep);
            z-index: 2000;
            display: none;
            flex-direction: column;
            padding: 40px 20px;
        }
        .modal-servers.active { display: flex; animation: slideUp 0.5s var(--spring); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .server-box {
            background: #0d0e15;
            border-left: 4px solid var(--gold);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* لوحة التحكم (القمة) */
        #adminPanel {
            position: fixed;
            top: 0; right: -100%;
            width: 90%; max-width: 400px; height: 100%;
            background: #08090f;
            z-index: 3000;
            padding: 40px 25px;
            transition: 0.6s var(--spring);
            border-left: 2px solid var(--neon-cyan);
        }
        #adminPanel.active { right: 0; }

        .admin-input {
            width: 100%; padding: 15px; background: #11121a;
            border: 1px solid #333; color: white;
            border-radius: 15px; margin-bottom: 15px; font-family: 'Cairo';
        }

        .admin-btn {
            width: 100%; padding: 16px; background: var(--neon-cyan);
            border: none; color: black; font-weight: 900;
            border-radius: 15px; cursor: pointer;
        }

        .overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 2500; backdrop-filter: blur(10px);
        }

        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 30px;
        }
        .stat-item { background: #111; padding: 15px; border-radius: 15px; text-align: center; }

    </style>
</head>
<body>

    <header>
        <div class="avatar-container" onclick="openAdminPrompt()">
            <img src="https://t.me/i/userpic/320/og4_z.jpg" class="main-avatar">
        </div>
        <div class="empire-title">نظام معلوماتي</div>
    </header>

    <!-- قسم معلوماتي الرئيسي -->
    <div class="maalomati-hero">
        <h3 style="margin: 0; color: var(--neon-cyan);">الإمبراطور @og4_z</h3>
        <p style="font-size: 13px; color: #aaa; margin: 10px 0;">مطور أنظمة تليجرام | مزود خدمات السيرفرات الموثوقة لجيش الإمبراطورية.</p>
    </div>

    <!-- شريط التنقل الذكي -->
    <div class="nav-sticky">
        <div class="nav-link active" onclick="switchTab('bots', this)">
            <i class="fas fa-robot"></i>
            <span>البوتات</span>
        </div>
        <div class="nav-link" onclick="switchTab('channels', this)">
            <i class="fas fa-satellite"></i>
            <span>القنوات</span>
        </div>
        <div class="nav-link" onclick="toggleServers(true)">
            <i class="fas fa-crown" style="color: var(--gold);"></i>
            <span style="color: var(--gold);">السيرفرات</span>
        </div>
        <div class="nav-link" onclick="window.location.href='https://t.me/og4_z'">
            <i class="fas fa-headset"></i>
            <span>الدعم</span>
        </div>
    </div>

    <!-- الأقسام الديناميكية -->
    <div id="bots-sec" class="content-wrap active"></div>
    <div id="channels-sec" class="content-wrap"></div>

    <!-- نافذة السيرفرات مقابل نجوم -->
    <div id="serversModal" class="modal-servers">
        <h1 style="text-align:center; font-family:'Orbitron'; color:var(--gold);">IMPERIAL SERVERS</h1>
        <div style="padding: 20px;">
            <div class="server-box">
                <div><h2 style="color:var(--gold); margin:0;">15 Star</h2><p>سيرفر لمدة 7 أيام</p></div>
                <a href="https://t.me/og4_z" class="card-btn" style="background:var(--gold)">طلب</a>
            </div>
            <div class="server-box">
                <div><h2 style="color:var(--gold); margin:0;">25 Star</h2><p>سيرفر لمدة 15 يوم</p></div>
                <a href="https://t.me/og4_z" class="card-btn" style="background:var(--gold)">طلب</a>
            </div>
            <div class="server-box">
                <div><h2 style="color:var(--gold); margin:0;">50 Star</h2><p>سيرفر لمدة 30 يوم</p></div>
                <a href="https://t.me/og4_z" class="card-btn" style="background:var(--gold)">طلب</a>
            </div>
        </div>
        <button onclick="toggleServers(false)" style="margin-top:auto; background:none; border:none; color:gray; padding:30px; font-weight:900;">العودة لنظام معلوماتي ←</button>
    </div>

    <!-- لوحة التحكم الإمبراطورية -->
    <div id="overlay" class="overlay" onclick="closeAdmin()"></div>
    <div id="adminPanel">
        <h2 style="color: var(--neon-cyan); font-family:'Orbitron';">ADMIN CONSOLE</h2>
        
        <div class="stats-grid">
            <div class="stat-item"><span id="botCount">0</span><br><small>بوتات</small></div>
            <div class="stat-item"><span id="chanCount">0</span><br><small>قنوات</small></div>
        </div>

        <label style="font-size:12px; color:gray;">الاسم:</label>
        <input type="text" id="elName" class="admin-input" placeholder="اسم البوت أو القناة">
        
        <label style="font-size:12px; color:gray;">اليوزر (بدون @):</label>
        <input type="text" id="elUser" class="admin-input" placeholder="مثلاً: og4_z">
        
        <label style="font-size:12px; color:gray;">تحديد القسم:</label>
        <select id="elType" class="admin-input" style="background:var(--neon-cyan); color:black; font-weight:900;">
            <option value="bots">إضافة لبوتات معلوماتي</option>
            <option value="channels">إضافة لقنوات معلوماتي</option>
        </select>
        
        <button class="admin-btn" onclick="addNewElement()">نـشـر فـوري</button>
        <p style="text-align:center; color:#333; margin-top:20px;" onclick="closeAdmin()">إغلاق اللوحة</p>
    </div>

    <script>
        const MASTER_PASS = "0623244022";

        // بوابة الإدارة عبر الضغط على الصورة
        function openAdminPrompt() {
            let p = prompt("أدخل كود المطور للوصول لنظام معلوماتي:");
            if(p === MASTER_PASS) {
                document.getElementById('adminPanel').classList.add('active');
                document.getElementById('overlay').style.display = 'block';
                updateStats();
            } else if(p !== null) alert("تم رفض الوصول!");
        }

        function closeAdmin() {
            document.getElementById('adminPanel').classList.remove('active');
            document.getElementById('overlay').style.display = 'none';
        }

        // تبديل الأقسام
        function switchTab(type, el) {
            document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
            document.querySelectorAll('.content-wrap').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            document.getElementById(type + '-sec').classList.add('active');
        }

        function toggleServers(show) {
            document.getElementById('serversModal').classList.toggle('active', show);
        }

        // معالجة البيانات
        function addNewElement() {
            const name = document.getElementById('elName').value;
            const user = document.getElementById('elUser').value.trim().replace('@','');
            const type = document.getElementById('elType').value;

            if(!name || !user) return;

            const entry = { name, user, type, id: Date.now() };
            let db = JSON.parse(localStorage.getItem('maalomati_db') || '[]');
            db.push(entry);
            localStorage.setItem('maalomati_db', JSON.stringify(db));

            render();
            closeAdmin();
            document.getElementById('elName').value = '';
            document.getElementById('elUser').value = '';
        }

        function render() {
            const bSec = document.getElementById('bots-sec');
            const cSec = document.getElementById('channels-sec');
            bSec.innerHTML = ''; cSec.innerHTML = '';

            let db = JSON.parse(localStorage.getItem('maalomati_db') || '[]');
            let bCount = 0, cCount = 0;

            db.forEach(item => {
                const card = `
                    <div class="imperial-card">
                        <img src="https://t.me/i/userpic/320/${item.user}.jpg" onerror="this.src='https://ui-avatars.com/api/?name=${item.name}&background=00f7ff&color=000'">
                        <div style="font-weight:900; font-size:14px; margin-bottom:5px;">${item.name}</div>
                        <div style="color:var(--neon-cyan); font-size:11px; margin-bottom:15px;">@${item.user}</div>
                        <a href="https://t.me/${item.user}" class="card-btn" target="_blank">دخول</a>
                        <i class="fas fa-trash-alt" onclick="deleteItem(${item.id})" style="display:block; margin-top:15px; color:#1a1a1a; font-size:10px; cursor:pointer;"></i>
                    </div>
                `;
                if(item.type === 'bots') { bSec.innerHTML += card; bCount++; }
                else { cSec.innerHTML += card; cCount++; }
            });

            document.getElementById('botCount').innerText = bCount;
            document.getElementById('chanCount').innerText = cCount;
        }

        function deleteItem(id) {
            let db = JSON.parse(localStorage.getItem('maalomati_db') || '[]');
            db = db.filter(i => i.id !== id);
            localStorage.setItem('maalomati_db', JSON.stringify(db));
            render();
        }

        window.onload = render;
    </script>
</body>
</html>
